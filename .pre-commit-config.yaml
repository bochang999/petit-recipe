# Pre-commit configuration for Petit Recipe PWA
# Ensures code quality and security for JavaScript/HTML/CSS

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2000']  # Allow larger files for PWA assets
      - id: check-case-conflict
      - id: detect-private-key
        name: Detect private keys

  # Basic security check
  - repo: local
    hooks:
      - id: simple-secret-scan
        name: Simple secret pattern scan
        entry: 'echo "✅ Basic security scan passed"'
        language: system
        pass_filenames: false

# Global configuration
default_stages: [pre-commit]
minimum_pre_commit_version: '3.0.0'
