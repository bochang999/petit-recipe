<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Petit Recipe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    
    <!-- Capacitor プラグイン読み込み (APK環境での動作確保) -->
    <script>
        // APK環境でのCapacitor検出
        if (typeof window.Capacitor !== 'undefined') {
            // ネイティブ環境では自動的に利用可能
            console.log('✅ ネイティブCapacitor環境検出');
        } else {
            // Web環境でのみCDN読み込み
            console.log('🌐 Web環境でCapacitor CDN読み込み');
            document.write('<script src="https://unpkg.com/@capacitor/core@7/dist/capacitor.js"><\/script>');
        }
    </script>
</head>
<body>
    <!-- ステータスバー緩衝材 (Android APK) -->
    <div class="status-bar-buffer"></div>
    
    <div id="app">
        <!-- 料理レシピ画面 -->
        <div id="recipes-screen" class="screen active">
            <header class="screen-header">
                <h1 class="app-title">🍳 Petit Recipe</h1>
                <div class="header-actions">
                    <!-- レシピ追加機能を削除 -->
                </div>
            </header>
            
            <div class="screen-content">
                <div class="search-container">
                    <input type="text" id="recipe-search" placeholder="レシピを検索..." class="search-input">
                </div>
                
                <div class="sort-tabs">
                    <button class="sort-tab active" data-sort="time">時系列</button>
                    <button class="sort-tab" data-sort="name">あいうえお順</button>
                    <button class="sort-tab" data-sort="popular">🔥人気順</button>
                </div>
                
                <div id="recipes-list" class="recipes-list">
                    <!-- レシピ一覧がここに表示される -->
                </div>
            </div>
        </div>

        <!-- レシピ詳細画面 -->
        <div id="recipe-detail-screen" class="screen">
            <header class="screen-header">
                <button class="back-button" onclick="showScreen('recipes-screen')">← 戻る</button>
                <h2 id="recipe-detail-title">レシピ詳細</h2>
            </header>
            
            <div class="screen-content">
                <!-- 分量調整 -->
                <div class="portion-adjustment">
                    <h3>人数調整</h3>
                    <div class="portion-slider-container">
                        <label for="portion-slider">人数: <span id="portion-value">1</span>人前</label>
                        <input type="range" id="portion-slider" min="1" max="4" value="1" class="portion-slider">
                        <div class="portion-markers">
                            <span>1人</span>
                            <span>2人</span>
                            <span>3人</span>
                            <span>4人</span>
                        </div>
                    </div>
                </div>

                <!-- 材料リスト -->
                <div class="ingredients-section">
                    <h3>材料</h3>
                    <div id="ingredients-list" class="ingredients-list">
                        <!-- 材料がここに表示される -->
                    </div>
                </div>

                <!-- 手順 -->
                <div class="steps-section">
                    <h3>手順</h3>
                    <div id="steps-list" class="steps-list">
                        <!-- 手順がここに表示される -->
                    </div>
                </div>


                <!-- バージョン履歴 -->
                <div class="version-history">
                    <h3>改良履歴</h3>
                    <div id="version-list" class="version-list">
                        <!-- バージョン履歴がここに表示される -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- レシピデータファイル読み込み（APK環境対応） -->
    <script src="recipes-data.js"></script>
    <script src="script.js"></script>
    
    <!-- APK Status Bar初期化 -->
    <script>
        // APK環境でのStatus Bar設定
        document.addEventListener('DOMContentLoaded', async function() {
            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                try {
                    console.log('🔧 APK Status Bar初期化開始');
                    
                    // Status Barプラグインが利用可能な場合のみ実行
                    if (window.Capacitor.Plugins.StatusBar) {
                        await window.Capacitor.Plugins.StatusBar.setStyle({
                            style: 'LIGHT'
                        });
                        await window.Capacitor.Plugins.StatusBar.setBackgroundColor({
                            color: '#3498db'
                        });
                        await window.Capacitor.Plugins.StatusBar.setOverlaysWebView({
                            overlay: false
                        });
                        console.log('✅ APK Status Bar設定完了');
                    }
                } catch (error) {
                    console.log('⚠️ Status Bar設定失敗:', error);
                }
            }
        });
    </script>
    
    <!-- Service Worker登録 (PWA対応) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker登録成功:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('❌ Service Worker登録失敗:', error);
                    });
            });
        }
    </script>
</body>
</html>
