<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Petit Recipe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    
    <!-- Capacitor プラグイン読み込み (APK環境での動作確保) -->
    <script>
        // APK環境でのCapacitor検出
        if (typeof window.Capacitor !== 'undefined') {
            // ネイティブ環境では自動的に利用可能
            console.log('✅ ネイティブCapacitor環境検出');
        } else {
            // Web環境でのみCDN読み込み
            console.log('🌐 Web環境でCapacitor CDN読み込み');
            document.write('<script src="https://unpkg.com/@capacitor/core@7/dist/capacitor.js"><\/script>');
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- 料理レシピ画面 -->
        <div id="recipes-screen" class="screen active">
            <header class="screen-header">
                <h1 class="app-title">🍳 Petit Recipe</h1>
                <div class="header-actions">
                    <!-- レシピ追加機能を削除 -->
                </div>
            </header>
            
            <div class="screen-content">
                <div class="search-container">
                    <input type="text" id="recipe-search" placeholder="レシピを検索..." class="search-input">
                </div>
                
                <div class="sort-tabs">
                    <button class="sort-tab active" data-sort="time">時系列</button>
                    <button class="sort-tab" data-sort="name">あいうえお順</button>
                    <button class="sort-tab" data-sort="popular">🔥人気順</button>
                </div>
                
                <div id="recipes-list" class="recipes-list">
                    <!-- レシピ一覧がここに表示される -->
                </div>

                <!-- 🧪 デバッグ用物理ボタン (レシピ一覧のみ表示) -->
                <div class="debug-area" style="margin: 10px; padding: 7px; border: 2px dashed #007bff; background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); display: none;">
                    <h3 style="margin: 0 0 5px 0; color: white;">🧪 デバッグテスト</h3>

                    <!-- 基本JavaScript実行テスト -->
                    <div style="margin-bottom: 5px;">
                        <button onclick="alert('JavaScript動作OK!')" style="margin: 5px; padding: 10px; font-size: 16px; background: #dc3545; color: white;">🔧 JS基本テスト</button>
                        <button onclick="document.getElementById('test-result').innerHTML='ボタン動作OK!' + new Date().toLocaleTimeString()" style="margin: 5px; padding: 10px; font-size: 16px; background: #ffc107;">🎯 DOM操作テスト</button>
                        <div id="test-result" style="padding: 5px; background: #fff; border: 1px solid #ccc; margin-top: 5px; min-height: 20px;"></div>
                    </div>

                    <!-- script.js関数テスト -->
                    <div style="margin-bottom: 5px;">
                        <button onclick="testSort('time')" style="margin: 5px; padding: 10px; font-size: 16px;">時系列テスト</button>
                        <button onclick="testSort('name')" style="margin: 5px; padding: 10px; font-size: 16px;">あいうえおテスト</button>
                        <button onclick="testSort('popular')" style="margin: 5px; padding: 10px; font-size: 16px;">人気順テスト</button>
                    </div>

                    <button onclick="showLogs()" style="margin: 5px; padding: 10px; font-size: 16px; background: #28a745; color: white;">ログ表示</button>
                </div>

                <!-- 🖥️ ログ表示エリア -->
                <div id="debug-logs" style="margin: 20px; padding: 15px; background: #000; color: #0f0; font-family: monospace; max-height: 300px; overflow-y: auto; display: none;">
                    <h4 style="color: #0f0; margin: 0 0 10px 0;">📱 ログ出力</h4>
                    <div id="log-content"></div>
                </div>
            </div>
        </div>

        <!-- レシピ詳細画面 -->
        <div id="recipe-detail-screen" class="screen">
            <header class="screen-header">
                <button class="back-button" onclick="window.app.navigateBack()">← 戻る</button>
                <h2 id="recipe-detail-title">レシピ詳細</h2>
            </header>

            <!-- 🧪 レシピ詳細用デバッグエリア -->
            <div class="debug-area-detail" style="margin: 5px; padding: 5px; border: 1px solid #28a745; background: #e8f5e9; display: none;">
                <strong style="color: #2e7d32;">🧪 戻るボタンデバッグ</strong>
                <button onclick="alert('戻るボタンテスト: window.app=' + (window.app ? 'あり' : 'なし'))" style="margin: 3px; padding: 5px; font-size: 12px; background: #ff9800;">戻るボタンテスト</button>
                <button onclick="window.app && window.app.navigateBack ? window.app.navigateBack() : alert('navigateBack関数なし')" style="margin: 3px; padding: 5px; font-size: 12px; background: #4caf50;">直接戻る実行</button>
                <button onclick="addDebugLog('戻るボタン押下: ' + new Date().toLocaleTimeString())" style="margin: 3px; padding: 5px; font-size: 12px; background: #2196f3;">ログ追加</button>
            </div>

            <div class="screen-content">
                <!-- 分量調整 -->
                <div class="portion-adjustment">
                    <h3>人数調整</h3>
                    <div class="portion-slider-container">
                        <label for="portion-slider">人数: <span id="portion-value">1</span>人前</label>
                        <input type="range" id="portion-slider" min="1" max="4" value="1" class="portion-slider">
                        <div class="portion-markers">
                            <span>1人</span>
                            <span>2人</span>
                            <span>3人</span>
                            <span>4人</span>
                        </div>
                    </div>
                </div>

                <!-- 材料リスト -->
                <div class="ingredients-section">
                    <h3>材料</h3>
                    <div id="ingredients-list" class="ingredients-list">
                        <!-- 材料がここに表示される -->
                    </div>
                </div>

                <!-- 手順 -->
                <div class="steps-section">
                    <h3>手順</h3>
                    <div id="steps-list" class="steps-list">
                        <!-- 手順がここに表示される -->
                    </div>
                </div>


                <!-- バージョン履歴 -->
                <div class="version-history">
                    <h3>改良履歴</h3>
                    <div id="version-list" class="version-list">
                        <!-- バージョン履歴がここに表示される -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- レシピデータファイル読み込み（APK環境対応） -->
    <script src="recipes-data.js"></script>
    <script type="module" src="script.js"></script>
    
    <!-- APK Status Bar初期化 -->
    <script>
        // APK環境でのStatus Bar設定
        document.addEventListener('DOMContentLoaded', async function() {
            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                try {
                    console.log('🔧 APK Status Bar初期化開始');
                    
                    // Status Barプラグインが利用可能な場合のみ実行
                    if (window.Capacitor.Plugins.StatusBar) {
                        await window.Capacitor.Plugins.StatusBar.setStyle({
                            style: 'LIGHT'
                        });
                        await window.Capacitor.Plugins.StatusBar.setBackgroundColor({
                            color: '#3498db'
                        });
                        await window.Capacitor.Plugins.StatusBar.setOverlaysWebView({
                            overlay: false
                        });
                        console.log('✅ APK Status Bar設定完了');
                    }
                } catch (error) {
                    console.log('⚠️ Status Bar設定失敗:', error);
                }
            }
        });
    </script>
    
    <!-- Service Worker登録 (PWA対応) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker登録成功:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('❌ Service Worker登録失敗:', error);
                    });
            });
        }
    </script>
</body>
</html>
